plugins { id 'com.android.application' }

android {
    namespace 'com.lavozdeprogreso.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lavozdeprogreso.app'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}

tasks.register('copyLauncherIcon', Copy) {
    from(rootProject.file('publi_macro_icon.png'))
    into(layout.projectDirectory.dir('src/main/res/drawable'))
}

tasks.named('preBuild').configure {
    dependsOn('copyLauncherIcon')
}
